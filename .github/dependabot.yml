version: 2
updates:
  # Maintain dependencies for PHP packages (Composer)
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      # codeql-action/init and /analyze MUST move together: CodeQL fails with
      # "Loaded a configuration file for version X, but running version Y" when
      # they differ, and dependabot proposes each subpath as its own pull
      # request -- so each one alone is red. Grouping keeps them in one commit.
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
